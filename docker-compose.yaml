services:
    mongo:
      image: mongo
      ports:
        - "27017:27017"
      restart: unless-stopped
      environment:
        MONGO_INITDB_ROOT_USERNAME: "Admin"
        MONGO_INITDB_ROOT_PASSWORD: "Anirudh123"
      container_name: mongo
      volumes:
        - mongo_data:/data/db
    mongo-express:
        image: mongo-express
        ports:
            - "8082:8081"
        environment:
            ME_CONFIG_MONGODB_ADMINUSERNAME: "Admin"
            ME_CONFIG_MONGODB_ADMINPASSWORD: "Anirudh123"
            ME_CONFIG_MONGODB_SERVER: "mongo"
        depends_on:
            - mongo
        container_name: mongo-express
    app:
        build: .
        ports:
            - "8501:8501"
        container_name: stream0-litapp
        environment:
            MONGO_URI: "mongodb://Admin:Anirudh123@mongo:27017/?authSource=admin"
        depends_on:
            - mongo
        

volumes:
    mongo_data:
